<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Каталог — МЕТАЛЛ-ИСТ</title>
<meta name="description" content="Каталог нержавеющего металлопроката: трубы, листы, фитинги, краны, фланцы.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=tube-tiles-21">
</head>
<body>
<div id="site-header"></div>

<main class="page catalog-page">
  <div class="container">
    <nav class="catalog-crumbs" aria-label="Путь к разделу">
      <a href="index.html">Главная</a><span aria-hidden="true">/</span><a href="catalog.html">Каталог</a><span id="catalogPath"></span>
    </nav>
    <section class="catalog-overview" id="catalogOverview" aria-labelledby="overviewTitle" hidden>
      <div class="catalog-overview-heading">
        <h1 id="overviewTitle">Каталог</h1>
        <a class="btn btn-ghost" href="catalog.html?view=all">Все товары →</a>
      </div>
      <div class="catalog-overview-grid" id="catalogOverviewGrid"></div>
      <a class="catalog-size-link" href="tube-sizes.html">
        <span><strong>Размеры нержавеющих труб</strong><small>Таблицы DIN, ISO и ГОСТ</small></span>
        <span aria-hidden="true">→</span>
      </a>
    </section>
    <div class="catalog-layout" id="catalogListing">
      <aside class="catalog-sidebar">
        <nav class="category-menu" aria-label="Разделы каталога">
          <h2>Наш ассортимент</h2>
          <div id="catalogNav"></div>
        </nav>
        <section class="filters" aria-labelledby="filterTitle">
          <h2 id="filterTitle">Подбор продукции</h2>
          <label for="search">Название, размер или стандарт</label>
          <input id="search" type="search" placeholder="Например, 57×3,5">
          <label for="grade">Марка стали</label>
          <select id="grade"><option value="">Все марки</option></select>
          <label for="stock">Наличие</label>
          <select id="stock">
            <option value="">Любое</option>
            <option value="на складе">На складе</option>
            <option value="под заказ">Под заказ</option>
          </select>
          <button class="btn btn-ghost" id="resetFilters" type="button">Сбросить фильтры</button>
        </section>
      </aside>
      <section class="catalog-results" aria-labelledby="catalogTitle">
        <div class="page-head">
          <h1 id="catalogTitle">Каталог нержавеющей стали</h1>
        </div>
        <p class="tube-reference-link" id="tubeReferenceLink"><a href="tube-sizes.html">Размеры труб по DIN, ISO и ГОСТ →</a></p>
        <div class="catalog-sections" id="catalogSections"></div>
        <div class="catalog-toolbar">
          <p id="resultCount" role="status"></p>
          <div class="catalog-controls">
            <label for="sort">Сортировка</label>
            <select id="sort">
              <option value="">По каталогу</option>
              <option value="name">По названию</option>
            </select>
            <div class="catalog-view" role="group" aria-label="Вид каталога">
              <button type="button" data-view="list" aria-pressed="false">Список</button>
              <button type="button" data-view="grid" aria-pressed="true">Плитка</button>
            </div>
          </div>
        </div>
        <div class="products-grid" id="productsGrid"></div>
      </section>
    </div>
  </div>
</main>

<div id="site-footer"></div>
<script src="js/data.js?v=valve-tiles-26"></script>
<script src="js/layout.js?v=consent-19"></script>
<script src="js/main.js?v=consent-19"></script>
<script src="js/catalog.js?v=valve-folders-25"></script>
</body>
</html>
